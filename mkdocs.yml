site_name: State of the Art — AI & Time Series
site_url: https://aitimeseries.com
copyright: This site is moderated by the officers of the IEEE AI and Time Series Working Group (AITS-WG).

theme:
  name: material
  # overrides/partials/copyright.html: the footer, with the officers.
  custom_dir: overrides
  language: en
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.top
    - search.highlight
    - toc.integrate

# md_in_html: Markdown inside the home page's <div class="latest-term" markdown>
# and <div class="term-panel" markdown> blocks, so their links stay checked by
# MkDocs. attr_list: the home page's buttons, [View SOTA →](…){ .term-btn }.
markdown_extensions:
  - md_in_html
  - attr_list

extra_css:
  - stylesheets/terminal.css
  - stylesheets/officers.css

extra_javascript:
  - javascripts/officers.js

# A link to a missing #anchor is a warning, so `mkdocs build --strict` in the
# sync fails on it: the home page's #ref- links are checked at every sync
# (C-S19-10). MkDocs also counts the id="…" of raw HTML as anchors.
validation:
  anchors: warn

# The officers, in the footer of every page (overrides/partials/copyright.html).
# email_encoded: the address reversed, then base64-encoded, never in clear;
# see the README, "Officers in the footer".
extra:
  officers:
    - role: Chair
      name: Jonathan Schneerson
      linkedin: https://www.linkedin.com/in/jschneerson/
      email_encoded: Z3JvLmVlZWlAbm9zcmVlbmhjc2o=
    - role: Vice Chair
      name: Georgia Schneerson
      linkedin: https://www.linkedin.com/in/gschneerson/
      email_encoded: Z3JvLmVlZWlAbm9zcmVlbmhjc2c=
    - role: Program Manager
      name: Christy Bahn
      linkedin: https://www.linkedin.com/in/christy-a-bahn-16750058/
      email_encoded: Z3JvLmVlZWlAbmhhYi5j

nav:
  - Home: index.md
  - IEEE P3579: p3579/index.md
  - IEEE P3998: p3998/index.md
  - Joint P3579 & P3998: p3579-p3998/index.md
  - Classification: classification.md

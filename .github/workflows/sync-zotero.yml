name: Sync Zotero References
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # The joint-page rules, checked offline before any page is generated:
      # a failing rule stops the run (C-S19-1).
      - name: Check the joint-page rules
        run: python scripts/check_matching.py

      - name: Run Zotero sync script
        run: python scripts/generate_sota.py
        env:
          ZOTERO_API_KEY:              ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_GROUP_ID_P3579:       ${{ secrets.ZOTERO_GROUP_ID_P3579 }}
          ZOTERO_GROUP_ID_P3998:       ${{ secrets.ZOTERO_GROUP_ID_P3998 }}

      # Build the generated site before any PR opens, without deploying it:
      # a page, link or nav error stops the run here instead of at the deploy
      # after the merge (C-S19-1). site/ is git-ignored, so it is not in the PR.
      # The versions are pinned, the same as deploy.yml's: an upstream release
      # cannot turn this step red and hold back a week's references (C-S19-9).
      - name: Build the site (strict, no deploy)
        run: |
          pip install mkdocs==1.6.1 mkdocs-material==9.8.1
          mkdocs build --strict

      # The built site, kept 7 days on the run page, so that the generated
      # pages, the home page's latest-updates panels included, can be looked
      # at before the merge.
      - name: Keep the built site as a preview
        uses: actions/upload-artifact@v4.6.2
        with:
          name: site-preview
          path: site/
          retention-days: 7

      - name: Open Pull Request if changes
        uses: peter-evans/create-pull-request@v7
        with:
          token:          ${{ secrets.GITHUB_TOKEN }}
          title:          "refs: Zotero sync"
          branch:         zotero-sync
          commit-message: "refs: update SOTA from Zotero"
          body: |
            Automatic sync from Zotero Group Libraries.
            Please review the changes before merging.
